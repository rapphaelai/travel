# Render Blueprint -- permite butonul "Deploy to Render" din README sa
# creeze automat serviciul, citind configul de aici. Doc:
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: raphael-travel-ugc-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # Cheia ta ElevenLabs -- NU e in acest fisier; Render o cere separat,
      # printr-un prompt in formularul de deploy (sync: false = introdusa manual,
      # niciodata comisa in git).
      - key: ELEVENLABS_API_KEY
        sync: false
    # Planul "free" nu suporta disc persistent -- contextele si video-urile
    # generate traiesc doar in storage-ul efemer al containerului. Supravietuiesc
    # cat timp serviciul ramane "treaz" (inclusiv dupa ce adoarme din inactivitate
    # si se trezeste), dar se pierd la fiecare deploy nou/restart manual.
    # Descarca video-urile importante imediat dupa generare. Pentru persistenta
    # reala intre redeploy-uri, treci pe planul "starter" si adauga un bloc
    # `disk` (vezi istoricul din git / README pentru varianta cu disc).
